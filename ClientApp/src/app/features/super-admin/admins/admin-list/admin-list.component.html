<div class="container">
    <h2>Quản lý Đơn vị (Admins)</h2>

    <table mat-table [dataSource]="admins" class="mat-elevation-z8">
        <!-- Id Column -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <!-- Username Column -->
        <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef> Tài khoản </th>
            <td mat-cell *matCellDef="let element"> {{element.username}} </td>
        </ng-container>

        <!-- FullName Column -->
        <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef> Tên Đơn vị </th>
            <td mat-cell *matCellDef="let element"> {{element.fullName}} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>

        <!-- User Count Column -->
        <ng-container matColumnDef="userCount">
            <th mat-header-cell *matHeaderCellDef> Số Users </th>
            <td mat-cell *matCellDef="let element"> {{element.userCount}} </td>
        </ng-container>

        <!-- Machine Count Column -->
        <ng-container matColumnDef="machineCount">
            <th mat-header-cell *matHeaderCellDef> Số Machines </th>
            <td mat-cell *matCellDef="let element"> {{element.machineCount}} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Thao tác </th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" (click)="openEditDialog(element)" matTooltip="Edit">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteAdmin(element)" matTooltip="Delete">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <button mat-raised-button color="primary" style="margin-top: 20px;" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon> Tạo Đơn vị Mới
    </button>
</div>
